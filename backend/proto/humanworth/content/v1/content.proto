syntax = "proto3";

package humanworth.content.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "humanworth/asset/v1/asset.proto";

option go_package = "github.com/KDZZZZZZ/human-worth/backend/gen/humanworth/content/v1;contentv1";

// Website draft RPCs are implemented; Challenge collaboration RPCs remain dependency contracts.
service ContentService {
  rpc CreateTaskDraft(CreateTaskDraftRequest) returns (CreateTaskDraftResponse);
  rpc GetMyTaskSubmission(GetMyTaskSubmissionRequest) returns (GetMyTaskSubmissionResponse);
  rpc ListMySubmissions(ListMySubmissionsRequest) returns (ListMySubmissionsResponse);
  rpc ReplaceTaskDraft(ReplaceTaskDraftRequest) returns (ReplaceTaskDraftResponse);
  // Gateway web session, CSRF; natural task/revision idempotency; 5s.
  rpc RequestTaskReview(RequestTaskReviewRequest) returns (RequestTaskReviewResponse);
  // Moderation mTLS only; no user assertion; immutable submitted snapshot.
  rpc GetReviewSnapshot(GetReviewSnapshotRequest) returns (GetReviewSnapshotResponse);
  // Moderation mTLS only; exact decision retry returns persisted receipt; 5s.
  rpc ApplyReviewDecision(ApplyReviewDecisionRequest) returns (ApplyReviewDecisionResponse);
  // Asset mTLS only, administrator assertion bound to this method; no callback.
  rpc CheckReviewAssetAccess(CheckReviewAssetAccessRequest) returns (CheckReviewAssetAccessResponse);

  // Public file access is checked only by Asset; no callback to Asset here.
  rpc CheckAssetAccess(CheckAssetAccessRequest) returns (CheckAssetAccessResponse);
  // Trusted Moderation decision application, NOT an admin/browser approval API.
  rpc ApplyAssetReview(ApplyAssetReviewRequest) returns (ApplyAssetReviewResponse);

  // Challenge dependencies: implemented by stateful integration fixtures until the full modules land.
  rpc GetChallengeTaskDescription(GetChallengeTaskDescriptionRequest) returns (GetChallengeTaskDescriptionResponse);
  rpc ListChallengeWorks(ListChallengeWorksRequest) returns (ListChallengeWorksResponse);
  rpc ListChallengeComments(ListChallengeCommentsRequest) returns (ListChallengeCommentsResponse);
  rpc CheckChallengeMaterials(CheckChallengeMaterialsRequest) returns (CheckChallengeMaterialsResponse);
  rpc OpenRunRegistration(OpenRunRegistrationRequest) returns (OpenRunRegistrationResponse);
  rpc CloseRunRegistration(CloseRunRegistrationRequest) returns (CloseRunRegistrationResponse);
  rpc RegisterChallengeCandidate(RegisterChallengeCandidateRequest) returns (RegisterChallengeCandidateResponse);
  rpc GetChallengeRegistration(GetChallengeRegistrationRequest) returns (GetChallengeRegistrationResponse);
}

message ArtifactInput {
  string kind = 1;
  optional string asset_id = 2;
  optional string url = 3;
}
message PermissionsInput {
  optional bool cloud_use = 1;
  optional string statement = 2;
}
message AgentConfigurationInput {
  string model = 1;
  optional string prompt = 2;
  optional string harness = 3;
  repeated string skills = 4;
  // Stored draft metadata only; never fetched, interpreted or executed.
  google.protobuf.Struct parameters = 5;
}
message EntryInput {
  // Exactly human or agent, matching OpenAPI.
  string side = 1;
  string title = 2;
  optional string description = 3;
  string source = 4;
  repeated ArtifactInput artifacts = 5;
  PermissionsInput permissions = 6;
  AgentConfigurationInput agent_configuration = 7;
}
message TaskDraftInput {
  string title = 1;
  optional string summary = 2;
  optional string description = 3;
  optional string category = 4;
  // Initial drafts are ordered components of this aggregate, not public entries.
  repeated EntryInput entries = 5;
}
message TaskSubmission {
  string id = 1;
  // Always derived from VerifyActor; not accepted in any input.
  string author_id = 2;
  int64 revision = 3;
  // Authoritative publication state; not a client-controlled visibility flag.
  string state = 4;
  TaskDraftInput content = 5;
  optional string review_id = 6;
  optional string rejection_reason = 7;
}
message CreateTaskDraftRequest {
  string actor_assertion = 1;
  string idempotency_key = 2;
  TaskDraftInput content = 3;
  // Gateway obtains this assertion for the same web session and Asset method.
  string asset_actor_assertion = 4;
}
message CreateTaskDraftResponse { TaskSubmission submission = 1; }
message GetMyTaskSubmissionRequest {
  string actor_assertion = 1;
  string task_id = 2;
}
message GetMyTaskSubmissionResponse { TaskSubmission submission = 1; }
message ListMySubmissionsRequest {
  string actor_assertion = 1;
  // Empty values select the only implemented first-phase values.
  string kind = 2;
  string state = 3;
  optional string category = 4;
  int32 limit = 5;
  string cursor = 6;
}
message ListMySubmissionsResponse {
  repeated TaskSubmission items = 1;
  string next_cursor = 2;
}
message ReplaceTaskDraftRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int64 expected_revision = 3;
  TaskDraftInput content = 4;
  string asset_actor_assertion = 5;
}
message ReplaceTaskDraftResponse { TaskSubmission submission = 1; }

// Artifact 是作品正文或文件，链接只能作为补充；不携带作者与模型身份。
message Artifact {
  oneof value {
    string text = 1;
    humanworth.asset.v1.Asset file = 2;
    string link = 3;
  }
}
message Work {
  string id = 1;
  repeated Artifact artifacts = 2;
}
message TaskAttachment {
  humanworth.asset.v1.Asset asset = 1;
  bool cloud_use_allowed = 2;
}
message TaskDescription {
  string task_id = 1;
  int64 revision = 2;
  string description = 3;
  repeated TaskAttachment attachments = 4;
}
message Comment {
  string id = 1;
  string body = 2;
}
// SnapshotRef 固定任务、作品目录及评论截点，禁止跨版本拼接真人标签。
message SnapshotRef {
  string task_id = 1;
  int64 task_revision = 2;
  int64 catalog_revision = 3;
  google.protobuf.Timestamp comment_cutoff = 4;
}
message GetChallengeTaskDescriptionRequest {
  SnapshotRef snapshot = 1;
}
message GetChallengeTaskDescriptionResponse {
  TaskDescription task = 1;
  bool visible = 2;
}
message ListChallengeWorksRequest {
  SnapshotRef snapshot = 1;
}
message ListChallengeWorksResponse {
  repeated Work works = 1;
  int64 catalog_revision = 2;
}
message ListChallengeCommentsRequest {
  SnapshotRef snapshot = 1;
}
message ListChallengeCommentsResponse {
  repeated Comment comments = 1;
  google.protobuf.Timestamp cutoff_at = 2;
}
message MaterialRef {
  string asset_id = 1;
  string source_kind = 2;
  string source_id = 3;
}
message CheckChallengeMaterialsRequest {
  string run_id = 1;
  SnapshotRef snapshot = 2;
  string purpose = 3;
  repeated string work_ids = 4;
  repeated MaterialRef materials = 5;
}
message CheckChallengeMaterialsResponse {
  bool allowed = 1;
  string authorization_version = 2;
}
message OpenRunRegistrationRequest {
  string run_id = 1;
  string task_id = 2;
}
message OpenRunRegistrationResponse {
  string state = 1;
}
// 关闭必须写墓碑，先关闭再收到打开请求也不能恢复通道。
message CloseRunRegistrationRequest {
  string run_id = 1;
  string task_id = 2;
}
message CloseRunRegistrationResponse {
  string state = 1;
}
message RegistrationReceipt {
  string run_id = 1;
  string candidate_id = 2;
  string entry_id = 3;
  string review_id = 4;
  string review_state = 5;
  bool created = 6;
}
// 登记、通道状态检查和审核 outbox 必须在 Content 自己的事务中提交。
message RegisterChallengeCandidateRequest {
  string run_id = 1;
  string candidate_id = 2;
  string task_id = 3;
  string source_attempt_id = 4;
  Work work = 5;
  string executor_config_hash = 6;
}
message RegisterChallengeCandidateResponse {
  RegistrationReceipt receipt = 1;
}
message GetChallengeRegistrationRequest {
  string run_id = 1;
  string candidate_id = 2;
}
message GetChallengeRegistrationResponse {
  RegistrationReceipt receipt = 1;
}

// An immutable reviewed snapshot, separate from the author's editable draft.
enum ReviewedTaskState {
  REVIEWED_TASK_STATE_UNSPECIFIED = 0;
  REVIEWED_TASK_STATE_PUBLISHED = 1;
  REVIEWED_TASK_STATE_TAKEN_DOWN = 2;
}
enum ReviewedEntryState {
  REVIEWED_ENTRY_STATE_UNSPECIFIED = 0;
  REVIEWED_ENTRY_STATE_APPROVED = 1;
  REVIEWED_ENTRY_STATE_APPROVAL_REVOKED = 2;
}
message EntryAssetReview {
  string entry_id = 1;
  ReviewedEntryState state = 2;
}
// Legacy 3C compatibility only. Exact historical requests replay their receipts.
// First approval of an unsubmitted draft is now FailedPrecondition; formal
// submissions can only be tightened (taken down/revoked), not approved here.
// Existing legacy snapshots retain expected_revision serialization. mTLS
// moderation only; 2s, safe exact-request retry. Use ApplyReviewDecision for new cases.
message ApplyAssetReviewRequest {
  string decision_id = 1;
  string task_id = 2;
  int64 submission_revision = 3;
  int64 expected_revision = 4;
  oneof decision {
    ReviewedTaskState task_state = 5;
    EntryAssetReview entry_review = 6;
  }
}
message ReviewedEntry {
  string id = 1;
  int32 position = 2;
  ReviewedEntryState state = 3;
}
message ApplyAssetReviewResponse {
  int64 revision = 1;
  repeated ReviewedEntry entries = 2;
}
message CheckAssetAccessRequest {
  humanworth.asset.v1.PublicAssetReference reference = 1;
}
// allowed requires the exact file reference, a published task and approved entry.
// No owner bypass, no grant/cache. mTLS asset only; 2s; read-only safe retry.
message CheckAssetAccessResponse {
  bool allowed = 1;
  int64 revision = 2;
}

// Content owns this immutable initial-bundle submission, including stable entry IDs.
message ReviewSnapshot {
  string review_id = 1;
  TaskSubmission submission = 2;
  repeated string entry_ids = 3;
  google.protobuf.Timestamp created_at = 4;
}
message RequestTaskReviewRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int64 expected_revision = 3;
  string asset_actor_assertion = 4;
}
message RequestTaskReviewResponse { TaskSubmission submission = 1; }
message GetReviewSnapshotRequest { string review_id = 1; }
message GetReviewSnapshotResponse { ReviewSnapshot snapshot = 1; }
enum ReviewOutcome {
  REVIEW_OUTCOME_UNSPECIFIED = 0;
  REVIEW_OUTCOME_APPROVE = 1;
  REVIEW_OUTCOME_REJECT = 2;
}
message ApplyReviewDecisionRequest {
  string decision_id = 1;
  string review_id = 2;
  string task_id = 3;
  int64 submission_revision = 4;
  ReviewOutcome outcome = 5;
  optional string reason = 6;
}
message ApplyReviewDecisionResponse {
  string decision_id = 1;
  string review_id = 2;
  string state = 3;
  int64 revision = 4;
  repeated ReviewedEntry entries = 5;
}
message CheckReviewAssetAccessRequest {
  string actor_assertion = 1;
  string review_id = 2;
  string asset_id = 3;
}
message CheckReviewAssetAccessResponse { bool allowed = 1; }
